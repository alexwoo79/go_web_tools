forms:
  - name: "jixiao_2026q2_table"
    title: "员工绩效季度考核目标责任书（表格版）"
    description: "由 Excel 模板自动生成：员工绩效季度考核目标责任书（表格版）"
    category: "hr"
    status: "published"
    weight_sum_total_limit: 1
    # 表单评分声明（可选）：声明“本表单如何被评分”，评分引擎只读此配置，不改代码
    scoring:
      mode: "single"            # single=每个评分人打一个总分；item_avg=逐项简单平均；item_weighted=逐项按权重汇总
      group: ""                 # 评分项所在的 repeated_group；留空=对所有含 score_field 的表格逐项打分
      score_field: "de_fen"     # 每项得分字段名
      weight_field: "dan_xiang_quan_zhong"  # 每项权重字段名
    fields:
      - name: "bu_men"
        label: "部门"
        type: "text"
        placeholder: "请输入部门"
        required: false
      - name: "gang_wei"
        label: "岗位"
        type: "text"
        placeholder: "请输入岗位"
        required: false
      - name: "xing_ming"
        label: "姓名"
        type: "text"
        placeholder: "请输入姓名"
        required: false
      - name: "key_tasks"
        label: "重点（专项）工作任务"
        type: "repeated_group"
        required: false
        default_rows: 3
        min_rows: 1
        max_rows: 100
        weight_sum_field: "dan_xiang_quan_zhong"
        weight_sum_limit: 1
        group_fields:
          - name: "xu_hao"
            label: "序号"
            type: "number"
            placeholder: "请输入序号"
            required: false
            min: 0
          - name: "kao_he_zhi_biao"
            label: "考核指标"
            type: "text"
            placeholder: "请输入考核指标"
            required: true
          - name: "dan_xiang_quan_zhong"
            label: "单项权重"
            type: "number"
            placeholder: "请输入单项权重"
            required: false
