root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/bin/go-web ./cmd/server"
  bin = "./tmp/bin/go-web"
  args_bin = ["--config", "config.yaml", "--port", "8080"]
  include_ext = ["go", "yaml"]
  exclude_dir = ["vue-form", "ui", "data", "bin", "tmp", "gitignore", "docs", "skills", ".git", ".vscode", ".venv", "node_modules"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  delay = 1000
  stop_on_error = true
  send_interrupt = false
  kill_delay = 500
  log = "tmp/air.log"

[log]
  time = true
  main_only = true
